<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">How AvaVideoPlayer works</title><desc id="desc">The VideoPlayer API selects a browser backend using HTMLMediaElement and WebGL, or a desktop playback engine using the native FFmpeg bridge. Desktop output reaches Avalonia or Skia video presentation and operating-system audio APIs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m0 0 10 5-10 5" fill="#78946c"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#20251f}.label{font-size:17px;font-weight:650}.small{font-size:13px;fill:#697066}.micro{font-size:11px;fill:#697066}.box{fill:#fff;stroke:#d9e2d3;stroke-width:1.5}.line{fill:none;stroke:#78946c;stroke-width:2;marker-end:url(#arrow)}.eyebrow{font-size:11px;letter-spacing:2px;fill:#527747;font-weight:650}</style></defs>
<rect width="1200" height="870" rx="22" fill="#f4f6f1"/>
<text x="42" y="46" class="eyebrow">ONE API · TWO PLAYBACK PATHS</text><text x="42" y="83" font-size="30" font-weight="650">From a play command to pixels and sound.</text>
<rect class="box" x="300" y="114" width="600" height="86" rx="13"/><text class="label" x="600" y="146" text-anchor="middle">Avalonia app → VideoPlayer / IVideoBackend</text><text class="small" x="600" y="173" text-anchor="middle">Open · Play · Pause · Seek · Volume · Tracks · 360° camera</text>
<path class="line" d="M480 201v27H290v28"/><path class="line" d="M720 201v27h190v28"/>
<rect class="box" x="42" y="260" width="492" height="81" rx="12"/><text class="eyebrow" x="65" y="283">BROWSER · AVALONIA + .NET WASM</text><text class="label" x="65" y="312">NativeControlHost → .NET / JS interop</text>
<rect class="box" x="666" y="260" width="492" height="81" rx="12"/><text class="eyebrow" x="689" y="283">DESKTOP</text><text class="label" x="689" y="312">FFmpegVideoBackend + PlaybackEngine</text>
<path class="line" d="M288 342v25"/><path class="line" d="M912 342v25"/>
<rect class="box" x="42" y="373" width="492" height="105" rx="12"/><text class="label" x="65" y="405">HTMLMediaElement</text><text class="small" x="65" y="432">BrowserVideoBackend + avavideo.js → browser decoding</text><text class="small" x="65" y="455">File / Blob URLs · browser codec support · CORS</text>
<rect class="box" x="666" y="373" width="492" height="105" rx="12"/><text class="label" x="689" y="405">Clock, bounded queues and native FFmpeg</text><text class="small" x="689" y="432">.NET interop → avavideo C ABI → libavformat / libavcodec</text><text class="small" x="689" y="455">libswscale · libswresample · libavfilter · libass subtitles</text>
<path class="line" d="M184 479v28H164v25"/><path class="line" d="M392 479v28h20v25"/>
<path class="line" d="M800 479v28h-25v25"/><path class="line" d="M1025 479v28h18v25"/>
<rect class="box" x="42" y="538" width="238" height="102" rx="12"/><text class="label" x="63" y="570">Browser video</text><text class="small" x="63" y="595">Flat: native video element</text><text class="small" x="63" y="618">360°: WebGL video texture</text>
<rect class="box" x="298" y="538" width="236" height="102" rx="12"/><text class="label" x="318" y="570">Browser audio</text><text class="small" x="318" y="595">Media element output</text><text class="small" x="318" y="618">Web Audio for demo checks</text>
<rect class="box" x="666" y="538" width="236" height="102" rx="12"/><text class="label" x="688" y="570">Decoded video</text><text class="small" x="688" y="595">BGRA → Avalonia presenter</text><text class="small" x="688" y="618">Optional Skia presenter</text>
<rect class="box" x="920" y="538" width="238" height="102" rx="12"/><text class="label" x="941" y="570">Decoded audio</text><text class="small" x="941" y="595">PCM → NativeAudioOutput</text><text class="small" x="941" y="618">Device clock and buffering</text>
<path class="line" d="M1040 641v26"/>
<rect x="42" y="680" width="1116" height="140" rx="13" fill="#eaf1e4" stroke="#d1ddc8"/>
<text class="eyebrow" x="66" y="707">SYSTEM APIS UNDER DESKTOP AUDIO OUTPUT</text>
<text class="label" x="66" y="741">macOS ARM64</text><text class="small" x="66" y="769">Core Audio / AudioToolbox</text><text class="micro" x="66" y="792">AudioQueueNewOutput · AudioQueueEnqueueBuffer</text>
<text class="label" x="452" y="741">Windows x64 / ARM64</text><text class="small" x="452" y="769">WASAPI (shared, event driven)</text><text class="micro" x="452" y="792">IAudioClient · IAudioRenderClient · IAudioClock</text>
<text class="label" x="862" y="741">Linux x64 / ARM64</text><text class="small" x="862" y="769">PulseAudio / ALSA fallback</text><text class="micro" x="862" y="792">libpulse · snd_pcm_* · PipeWire Pulse compatibility</text>
<text class="micro" x="42" y="846">Architecture describes the implemented paths. Hardware/device execution coverage is documented separately.</text></svg>
